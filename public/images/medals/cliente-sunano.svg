    <radialGradient id="blush">
      <stop offset="0" stop-color="#f7875a" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#f7875a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f7875a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#5b2a16" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
