name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Egresso do Storage estourou a cota em ago/2026 por upload sem
      # compressão e sem cache longo. Ver scripts/check-upload-hygiene.ts.
      - run: npm run check:uploads
