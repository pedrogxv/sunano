<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" fill="none">
  <defs>
    <linearGradient id="plumage" x1="0" y1="100" x2="0" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcd23f"/>
      <stop offset="0.42" stop-color="#fde07c"/>
      <stop offset="0.56" stop-color="#fff4d8"/>
      <stop offset="1" stop-color="#fbeccd"/>
    </linearGradient>
    <linearGradient id="bag" x1="400" y1="250" x2="520" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="box" x1="60" y1="400" x2="170" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="290" x2="0" y2="385" gradientUnits="userSpaceOnUse">
