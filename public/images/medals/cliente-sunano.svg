    <rect x="96" y="58" width="22" height="62" rx="9" transform="rotate(-28 107 89)" fill="#fcd34d"/>
    <rect x="138" y="36" width="22" height="66" rx="9" transform="rotate(-8 149 69)" fill="#fcd34d"/>
    <rect x="62" y="118" width="20" height="50" rx="8" transform="rotate(-55 72 143)" fill="#fcd34d"/>

    <!-- caixa de presente (atrás, no chão) -->
    <path d="M62 418h104v68a8 8 0 0 1-8 8H70a8 8 0 0 1-8-8z" fill="url(#box)"/>
    <path d="M54 398h120v24H54z" fill="#fde68a"/>
    <path d="M106 398v96" stroke-width="5"/>
    <path d="M106 398v96" stroke="#ef4444" stroke-width="12" stroke-linecap="butt"/>
    <path d="M106 398c-10-26-44-30-40-8 3 12 26 10 40 8zM106 398c10-26 44-30 40-8-3 12-26 10-40 8z" fill="#ef4444"/>

    <!-- alça da sacola -->
