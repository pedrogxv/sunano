    <path d="M404 250h112a8 8 0 0 1 8 7l1.5 17H394.5l1.5-17a8 8 0 0 1 8-7z" fill="#fed7aa"/>
    <path d="M460 288l9.5 19.2 21.2 3.1-15.4 15 3.6 21.1L460 336.4l-18.9 10 3.6-21.1-15.4-15 21.2-3.1z" fill="#fffbeb" stroke-width="5"/>

    <!-- corpo + cabeça -->
    <path d="M258 100C340 100 382 160 380 228C379 270 372 290 384 322C406 372 402 440 352 470C312 492 206 494 166 470C116 440 112 372 136 322C148 290 136 270 136 228C136 160 176 100 258 100Z" fill="url(#plumage)"/>

    <!-- topete -->
    <path d="M220 120C204 92 186 70 160 56C196 56 228 76 246 108Z" fill="#fcd23f"/>
    <path d="M232 112C228 70 214 44 190 22C240 34 268 64 272 104Z" fill="#fcd23f"/>
    <path d="M262 106C266 76 280 56 302 44C296 70 292 90 284 110Z" fill="#fcd23f"/>

    <!-- lenço -->
