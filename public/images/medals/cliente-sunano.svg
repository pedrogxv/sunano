  <circle cx="209" cy="195" r="8.5" fill="#fff"/>
  <circle cx="227" cy="213" r="4" fill="#fff"/>

  <!-- texto do lenço -->
  <text x="265" y="330" text-anchor="middle" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="23" fill="#fff7ed" letter-spacing="1">CLIENTE</text>
  <path d="M265 340l3.5 7 7.7 1.1-5.6 5.4 1.3 7.6-6.9-3.6-6.9 3.6 1.3-7.6-5.6-5.4 7.7-1.1z" fill="#fff7ed"/>

  <g stroke="#5b2a16" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
