    <path d="M142 292c-22-6-40 2-42 18 18 4 34 0 44-6M148 300c-18 12-26 28-18 40 14-8 22-20 22-32" fill="#fb923c"/>
  </g>

  <!-- bochechas (sem contorno) -->
